# Batteria continua (standard Southside, capitolo 5): tipi + test a ogni push e richiesta di unione.
# Con la regola di protezione di main («verifica» obbligatorio) nulla di rosso arriva in main, quindi nulla si pubblica.
name: verifica
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-24.04
    services:
      # togliere se il progetto non ha un database
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prova
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPROVA_URL: postgres://postgres:prova@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verifica
